<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión Mayorista</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e1e4ea;--ac:#1f6feb;--sb:#14213d;--sbt:#c9d1e6;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#e8ebf2;--mut:#98a1b5;--bd:#2a3142;--ac:#4c8dff;--sb:#0b0e15;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#e8ebf2;--mut:#98a1b5;--bd:#2a3142;--ac:#4c8dff;--sb:#0b0e15;--ok:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
nav{width:230px;background:var(--sb);color:var(--sbt);padding:16px 0;flex-shrink:0;display:flex;flex-direction:column}.bk{margin-top:auto;padding:14px 12px 4px;display:flex;flex-direction:column;gap:6px}nav .bk button{color:var(--sbt);border-color:rgba(255,255,255,.2);font-size:12px;white-space:nowrap}textarea{font:12px monospace;width:100%;padding:7px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--tx)}
nav h1{font-size:16px;color:#fff;margin:0 18px 14px}
nav .g{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0;padding:12px 18px 6px;opacity:.85;cursor:pointer;user-select:none;font-weight:600}nav .g:hover{opacity:1}nav .sub[hidden]{display:none}
nav a{display:block;padding:8px 18px 8px 26px;color:var(--sbt);cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.07)}nav a.on{background:rgba(255,255,255,.12);color:#fff;border-color:var(--ac)}
main{flex:1;padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}.r{text-align:right}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font:inherit}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:4px 9px}button.d{color:var(--bad)}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--tx);width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
.row{display:grid;grid-template-columns:3fr .8fr 1.2fr .8fr .7fr 1.2fr auto;gap:6px;margin-bottom:6px;align-items:center}
.pos{color:var(--bad)}.neg{color:var(--ok)}.mut{color:var(--mut)}.low{color:var(--bad);font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.kp{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 16px}.tot{margin-left:auto;width:290px;max-width:100%}.tot div{display:flex;justify-content:space-between;padding:2px 0}.tot .t{border-top:1px solid var(--bd);margin-top:4px;padding-top:6px;font-size:16px;font-weight:700}
.kp b{display:block;font-size:18px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.kc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;cursor:pointer}.kc:hover{border-color:var(--ac)}.kc b{display:block;font-size:24px;margin:4px 0 10px}.sl div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid var(--bd);font-size:13px}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;display:flex;flex-direction:row;align-items:center;overflow-x:auto;padding:8px}nav .bk{flex-direction:row;margin:0 0 0 auto;padding:0 0 0 8px}nav h1,nav .g{display:none}nav .sub,nav .sub[hidden]{display:contents}nav a{white-space:nowrap;padding:8px 12px;border:0}main{padding:12px}.row{grid-template-columns:1fr 1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<nav id="nav"></nav><main id="main"></main>
<script>
const KEY='mayorista_v1';let S={clients:[],suppliers:[],articles:[],sales:[],purchases:[],receipts:[],payments:[],banks:[],bankMovs:[],cashMovs:[]};

let _n=Math.max(0,...S.articles.map(a=>parseInt(a.code)||0));S.articles.forEach(a=>{if(!parseInt(a.code))a.code=String(++_n)});
const nextCode=()=>String(Math.max(0,...S.articles.map(a=>parseInt(a.code)||0))+1);
const save=()=>{if(!ready)return;pending=true;setSync('☁ Guardando…');clearTimeout(tmr);tmr=setTimeout(cloudSave,500)};
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(q,e=document)=>e.querySelector(q),uid=()=>Date.now().toString(36)+String(_u++%1000).padStart(3,'0');let _u=0;
const money=n=>(+n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS'});
const today=()=>new Date().toISOString().slice(0,10),fd=d=>d.split('-').reverse().join('/');
const MENU=[['Ventas',[['ccv','Cuentas Corrientes'],['clientes','Clientes'],['fv','Facturas Venta'],['rec','Recibo']]],
['Compras',[['ccc','Cuentas Corrientes'],['proveedores','Proveedores'],['fc','Facturas Compra'],['op','Orden de pago']]],
['Stock',[['stock','Informe de stock'],['articulos','Artículos']]],
['Bancos',[['nbanco','Nuevo Banco'],['movbanco','Movimientos Bancarios'],['caja','Caja']]]];
let view='clientes',sel={ccv:'',ccc:''};
const find=(arr,id)=>S[arr].find(x=>x.id===id)||{};
const stockOf=id=>{let n=0;S.purchases.forEach(f=>f.items.forEach(i=>{if(i.art===id)n+=i.qty}));S.sales.forEach(f=>f.items.forEach(i=>{if(i.art===id)n-=i.qty}));return n};
const open={Ventas:true,Compras:true,Stock:true,Bancos:true};
function nav(){$('#nav').innerHTML='<h1>📦 Gestión Mayorista</h1>'+'<a class="'+(view==='inicio'?'on':'')+'" data-k="inicio" style="padding-left:18px;font-weight:600">🏠 Inicio</a>'+MENU.map(([g,it])=>`<div class="g" data-g="${g}">${open[g]?'▾':'▸'} ${g}</div><div class="sub" ${open[g]?'':'hidden'}>`+it.map(([k,l])=>`<a class="${k===view?'on':''}" data-k="${k}">${l}</a>`).join('')+'</div>').join('')+'<div class="bk"><div style="font-size:11px;word-break:break-all;color:var(--sbt)">'+h(userEmail)+'<br><span id="sy">'+h(syncMsg)+'</span></div><button class="s" data-bk="save">💾 Guardar copia</button><button class="s" data-bk="load">📂 Cargar copia</button><button class="s" data-bk="out">⎋ Cerrar sesión</button></div>'}
$('#nav').onclick=e=>{const k=e.target.dataset.k,g=e.target.dataset.g,bk=e.target.dataset.bk;if(bk){bk==='save'?backup():bk==='load'?restore():logout()}else if(g){open[g]=!open[g];nav()}else if(k){view=k;go()}};
function go(){nav();const m=$('#main');({clientes:()=>parties(m,'clients','Clientes'),proveedores:()=>parties(m,'suppliers','Proveedores'),articulos:arts,stock:stk,fv:()=>invs('sales'),fc:()=>invs('purchases'),rec:()=>pays('receipts'),op:()=>pays('payments'),ccv:()=>cc('clients'),ccc:()=>cc('suppliers'),nbanco:banks,movbanco:movs,caja:caja,inicio:inicio})[view](m)}
function modal(title,body,onOk,okText='Guardar'){const b=document.createElement('div');b.className='bg';b.innerHTML=`<div class="md"><h2>${title}</h2>${body}<div class="acts"><button class="s" id="cx">Cancelar</button><button id="ok">${okText}</button></div></div>`;document.body.appendChild(b);
const close=()=>b.remove();$('#cx',b).onclick=close;$('#ok',b).onclick=()=>{if(onOk(b)!==false){close();save();go()}};return b}
const inp=(id,l,v='',t='text')=>`<label>${l}</label><input id="${id}" type="${t}" value="${h(v)}">`;
const hdr=(t,btn)=>`<div class="top"><h2>${t}</h2>${btn||''}</div>`;
function used(coll,id){return S.sales.concat(S.purchases,S.receipts,S.payments).some(x=>x.party===id||(x.items||[]).some(i=>i.art===id))}
function del(coll,id){if(used(coll,id))return alert('No se puede eliminar: tiene movimientos.');if(confirm('¿Eliminar?')){S[coll]=S[coll].filter(x=>x.id!==id);save();go()}}
/* ---- Clientes / Proveedores ---- */
const PROVS=['Buenos Aires','CABA','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucumán'];
const addr=p=>p.calle||p.loc||p.prov?[[p.calle,p.nro].filter(Boolean).join(' '),[p.cp,p.loc].filter(Boolean).join(' '),p.prov].filter(Boolean).join(', '):(p.dir||'');
function parties(m,coll,title){
 const one=title.slice(0,-1).toLowerCase();
 m.innerHTML=hdr(title,`<button id="new">+ Nuevo ${one}</button>`)+`<div class="card"><table><tr><th>Nombre / Razón social</th><th>CUIT</th><th>Condición IVA</th><th>Teléfono</th><th>Email</th><th>Dirección</th><th></th></tr>${S[coll].map(p=>`<tr><td>${h(p.name)}</td><td>${h(p.cuit)}</td><td>${h(p.cond||'-')}</td><td>${h(p.tel)}</td><td>${h(p.mail)}</td><td>${h(addr(p))}</td><td class="r"><button class="s" data-e="${p.id}">Editar</button> <button class="s d" data-d="${p.id}">✕</button></td></tr>`).join('')||'<tr><td colspan=7 class="mut">Sin registros</td></tr>'}</table></div>`;
 const form=p=>modal((p?'Editar ':'Nuevo ')+one,inp('n','Nombre / Razón social *',p?.name)+inp('c','CUIT',p?.cuit)+`<label>Condición frente al IVA *</label><select id="co">${['Consumidor Final','Responsable Inscripto','Monotributo'].map(v=>`<option ${v===(p?.cond||'Responsable Inscripto')?'selected':''}>${v}</option>`).join('')}</select>`+inp('t','Teléfono',p?.tel)+inp('m','Email',p?.mail)+(p?.dir&&!p?.calle?`<div class="mut">Dirección anterior: ${h(p.dir)}</div>`:'')+`<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px">${inp('ca','Calle',p?.calle)}${inp('nr','Número',p?.nro)}</div><div style="display:grid;grid-template-columns:1fr 2fr;gap:8px">${inp('cp','Código postal',p?.cp)}${inp('lo','Localidad',p?.loc)}</div><label>Provincia</label><select id="pr"><option value="">— Seleccionar —</option>${PROVS.map(v=>`<option ${v===p?.prov?'selected':''}>${v}</option>`).join('')}</select>`,b=>{const name=$('#n',b).value.trim();if(!name)return alert('Ingresá el nombre'),false;
  const o=p||{id:uid()};Object.assign(o,{name,cuit:$('#c',b).value,cond:$('#co',b).value,tel:$('#t',b).value,mail:$('#m',b).value,calle:$('#ca',b).value,nro:$('#nr',b).value,cp:$('#cp',b).value,loc:$('#lo',b).value,prov:$('#pr',b).value});if(!p)S[coll].push(o)});
 $('#new').onclick=()=>form();m.onclick=e=>{const t=e.target;if(t.dataset.e)form(find(coll,t.dataset.e));if(t.dataset.d)del(coll,t.dataset.d)}}
/* ---- Artículos ---- */
function arts(m){
 m.innerHTML=hdr('Artículos',`<button id="new">+ Nuevo artículo</button>`)+`<div class="card"><table><tr><th>Código</th><th>Artículo</th><th>Unidad</th><th class="r">Costo neto</th><th class="r">Precio venta neto</th><th class="r">IVA</th><th></th></tr>${S.articles.map(a=>`<tr><td>${h(a.code)}</td><td>${h(a.name)}</td><td>${h(a.unit)}</td><td class="r">${money(a.cost)}</td><td class="r">${money(a.price)}</td><td class="r">${a.iva??21}%</td><td class="r"><button class="s" data-e="${a.id}">Editar</button> <button class="s d" data-d="${a.id}">✕</button></td></tr>`).join('')||'<tr><td colspan=7 class="mut">Sin artículos. Ej: Coca Cola 2lts</td></tr>'}</table></div>`;
 const form=a=>modal(a?'Editar artículo':'Nuevo artículo',`<div class="mut">Código: <b>${a?h(a.code):nextCode()}</b> (automático)</div>`+inp('n','Nombre * (ej: Coca Cola 2lts)',a?.name)+inp('u','Unidad (caja, bulto, unidad)',a?.unit||'unidad')+inp('co','Costo neto (sin IVA)',a?.cost||0,'number')+inp('p','Precio de venta neto (sin IVA)',a?.price||0,'number')+`<label>Alícuota de IVA *</label><select id="iv">${IVAS.map(v=>`<option value="${v}" ${v===(a?(a.iva??21):21)?'selected':''}>${v}%</option>`).join('')}</select>`,b=>{const name=$('#n',b).value.trim();if(!name)return alert('Ingresá el nombre'),false;
  const o=a||{id:uid()};Object.assign(o,{code:a?a.code:nextCode(),name,unit:$('#u',b).value,cost:+$('#co',b).value,price:+$('#p',b).value,iva:+$('#iv',b).value});if(!a)S.articles.push(o)});
 $('#new').onclick=()=>form();m.onclick=e=>{const t=e.target;if(t.dataset.e)form(find('articles',t.dataset.e));if(t.dataset.d)del('articles',t.dataset.d)}}
/* ---- Stock ---- */
function stk(m){const rows=S.articles.map(a=>({a,s:stockOf(a.id)}));const val=rows.reduce((t,r)=>t+r.s*r.a.cost,0);
 m.innerHTML=hdr('Informe de stock')+`<div class="kp"><div>Artículos<b>${rows.length}</b></div><div>Valor a costo<b>${money(val)}</b></div></div><div class="card"><table><tr><th>Código</th><th>Artículo</th><th>Unidad</th><th class="r">Stock</th><th class="r">Costo</th><th class="r">Valorizado</th></tr>${rows.map(({a,s})=>`<tr><td>${h(a.code)}</td><td>${h(a.name)}</td><td>${h(a.unit)}</td><td class="r ${s<=0?'low':''}">${s}</td><td class="r">${money(a.cost)}</td><td class="r">${money(s*a.cost)}</td></tr>`).join('')||'<tr><td class="mut">Sin artículos</td></tr>'}</table></div>`}
/* ---- Facturas ---- */
const IVAS=[0,10.5,21,27];
function invs(coll){const sale=coll==='sales',pc=sale?'clients':'suppliers',m=$('#main');
 m.innerHTML=hdr(sale?'Facturas de Venta':'Facturas de Compra',`<button id="new">+ Nueva factura</button>`)+`<div class="card"><table><tr><th>Fecha</th><th>Nº Factura</th><th>${sale?'Cliente':'Proveedor'}</th><th>CUIT</th><th class="r">Neto</th><th class="r">IVA</th><th class="r">Total</th><th></th></tr>${[...S[coll]].sort((a,b)=>b.date.localeCompare(a.date)).map(f=>{const p=find(pc,f.party);return `<tr><td>${fd(f.date)}</td><td>${h(f.number)}</td><td>${h(p.name)}</td><td>${h(p.cuit)}</td><td class="r">${money(f.neto??f.total)}</td><td class="r">${money(f.iva||0)}</td><td class="r"><b>${money(f.total)}</b></td><td class="r"><button class="s" data-v="${f.id}">Ver</button> <button class="s d" data-d="${f.id}">✕</button></td></tr>`}).join('')||'<tr><td colspan=8 class="mut">Sin facturas</td></tr>'}</table></div>`;
 m.onclick=e=>{const d=e.target.dataset;if(d.d&&confirm('¿Eliminar factura? El stock y la cuenta corriente se recalculan.')){S[coll]=S[coll].filter(f=>f.id!==d.d);save();go()}
  if(d.v){const f=find(coll,d.v),p=find(pc,f.party);modal('Factura '+h(f.number),`<p>${sale?'Cliente':'Proveedor'}: <b>${h(p.name)}</b> · CUIT ${h(p.cuit)} · ${h(p.cond||'')}<br>Fecha: ${fd(f.date)}</p><table><tr><th>Artículo</th><th class="r">Cant.</th><th class="r">Unit.</th><th class="r">Bonif.</th><th class="r">Neto</th><th class="r">IVA</th></tr>${f.items.map(i=>`<tr><td>${h(find('articles',i.art).name)}</td><td class="r">${i.qty}</td><td class="r">${money(i.price)}</td><td class="r">${i.bonif||0}%</td><td class="r">${money(i.qty*i.price*(1-(i.bonif||0)/100))}</td><td class="r">${i.iva??0}%</td></tr>`).join('')}</table><div class="tot">${totHtml(f.items,{ri:f.retIva,rb:f.retIibb,cn:f.cng})}</div>`,()=>true,'Cerrar')}};
 $('#new').onclick=()=>{if(!S[pc].length)return alert('Primero cargá un '+(sale?'cliente':'proveedor'));if(!S.articles.length)return alert('Primero cargá artículos en Stock → Artículos');
  const ao=S.articles.map(a=>`<option value="${a.id}">${h(a.code)} · ${h(a.name)}</option>`).join('');
  const line=()=>`<div class="row"><select class="a">${ao}</select><input class="q" type="number" min="1" value="1"><input class="p" type="number" step="0.01"><input class="bo" type="number" min="0" max="100" step="0.01" value="0"><span class="iv mut">21%</span><b class="st r">$0</b><button class="s d x">✕</button></div>`;
  const b=modal(sale?'Nueva factura de venta':'Nueva factura de compra',`<label>${sale?'Cliente':'Proveedor'} *</label><select id="pt">${S[pc].map(p=>`<option value="${p.id}">${h(p.name)}</option>`).join('')}</select><div class="mut" id="cu"></div>${inp('dt','Fecha de factura',today(),'date')}<div style="display:grid;grid-template-columns:1fr 2fr;gap:8px">${inp('pv','Punto de venta','0001')}${inp('nu','Número de factura',String(S[coll].length+1).padStart(8,'0'))}</div><label>Artículos (cantidad · ${sale?'precio':'costo'} unitario neto · % bonificación · IVA · neto)</label><div id="ls"></div><button class="s" id="al">+ Agregar artículo</button><label style="margin-top:12px">Después del IVA (suman al total, no entran en el cálculo de IVA)</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div><label>Retención IVA</label><input id="ri" type="number" step="0.01" value="0"></div><div><label>Retención IIBB</label><input id="rb" type="number" step="0.01" value="0"></div><div><label>Conceptos no gravados</label><input id="cn" type="number" step="0.01" value="0"></div></div><div class="tot" id="tt"></div>`,b=>{
   const items=rows(b);if(!items.length)return alert('Agregá al menos un artículo'),false;
   const pv=$('#pv',b).value.trim().padStart(4,'0'),nu=$('#nu',b).value.trim().padStart(8,'0'),number=pv+'-'+nu,party=$('#pt',b).value;
   if(S[coll].some(x=>x.party===party&&x.number===number))return alert('Ya existe la factura '+number+' para este '+(sale?'cliente':'proveedor')),false;
   if(sale){const need={};items.forEach(i=>need[i.art]=(need[i.art]||0)+i.qty);for(const k in need)if(stockOf(k)<need[k])return alert(`Stock insuficiente de ${find('articles',k).name} (disponible: ${stockOf(k)})`),false}
   const t=totals(items),e=ex(b);S[coll].push({id:uid(),party,date:$('#dt',b).value,number,items,bonif:t.bonif,neto:t.neto,iva:t.iva,retIva:e.ri,retIibb:e.rb,cng:e.cn,total:t.neto+t.iva+e.ri+e.rb+e.cn})},'Guardar factura');
  const rows=b=>[...b.querySelectorAll('.row')].map(r=>({art:$('.a',r).value,qty:+$('.q',r).value,price:+$('.p',r).value,bonif:Math.min(100,Math.max(0,+$('.bo',r).value||0)),iva:ivaOf($('.a',r).value)})).filter(i=>i.qty>0);
  const ex=b=>({ri:+$('#ri',b).value||0,rb:+$('#rb',b).value||0,cn:+$('#cn',b).value||0});
  const calc=()=>{b.querySelectorAll('.row').forEach(r=>$('.st',r).textContent=money($('.q',r).value*$('.p',r).value*(1-(+$('.bo',r).value||0)/100)));$('#tt',b).innerHTML=totHtml(rows(b),ex(b))};
  const fill=r=>{const a=find('articles',$('.a',r).value);$('.p',r).value=sale?a.price:a.cost;$('.iv',r).textContent=(a.iva??21)+'%';calc()};
  const add=()=>{$('#ls',b).insertAdjacentHTML('beforeend',line());fill($('#ls',b).lastElementChild)};
  const cu=()=>{const p=find(pc,$('#pt',b).value);$('#cu',b).textContent='CUIT: '+(p.cuit||'(sin cargar)')+' · '+(p.cond||'')};cu();
  add();$('#al',b).onclick=add;
  b.addEventListener('change',e=>{if(e.target.classList.contains('a'))fill(e.target.parentElement);if(e.target.id==='pt')cu()});b.addEventListener('input',calc);
  b.addEventListener('click',e=>{if(e.target.classList.contains('x')&&b.querySelectorAll('.row').length>1){e.target.parentElement.remove();calc()}})}}
const ivaOf=id=>find('articles',id).iva??21;

 $('#main').innerHTML=`<div class="card" style="max-width:380px;margin:8vh auto"><h2>Nueva contraseña</h2>${inp('np','Nueva contraseña (mínimo 6 caracteres)','','password')}<div id="lm" class="pos" style="margin:10px 0;min-height:18px"></div><button id="gp">Guardar contraseña</button></div>`;
 $('#gp').onclick=async()=>{const p=$('#np').value;if(p.length<6)return $('#lm').textContent='Mínimo 6 caracteres';const{error}=await sb.auth.updateUser({password:p});if(error)return $('#lm').textContent=tr(error.message);history.replaceState(null,'',location.pathname);enter()}}
async function enter(){const{data:{session}}=await sb.auth.getSession();if(!session)return authScreen();
 uid0=session.user.id;userEmail=session.user.email||'';ready=false;$('#nav').style.display='';$('#main').innerHTML='<div class="card">Cargando tus datos…</div>';
 const{data,error}=await sb.from('app_data').select('data').eq('user_id',uid0).maybeSingle();
 if(error){if(/JWT|expired/i.test(error.message))return sessionLost();$('#main').innerHTML=`<div class="card"><p class="pos">No se pudieron cargar los datos: ${h(error.message)}</p><button id="rt">Reintentar</button></div>`;$('#rt').onclick=enter;return}
 KEYS.forEach(k=>S[k]=[]);
 if(data){KEYS.forEach(k=>S[k]=Array.isArray(data.data?.[k])?data.data[k]:[]);ready=true;setSync('☁ Guardado')}
 else{let loc=null;try{loc=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(loc&&KEYS.some(k=>(loc[k]||[]).length)&&confirm('Se encontraron datos guardados en este navegador. ¿Querés subirlos a tu cuenta en la nube?'))KEYS.forEach(k=>S[k]=Array.isArray(loc[k])?loc[k]:[]);
  ready=true;await cloudSave()}
 fixCodes();view='inicio';go()}
async function sessionLost(){ready=false;uid0=null;await sb.auth.signOut();authScreen('Tu sesión venció o fue deshabilitada. Ingresá nuevamente.')}
async function logout(){if(pending&&!confirm('Hay cambios que todavía no se guardaron. ¿Cerrar sesión igual?'))return;ready=false;uid0=null;await sb.auth.signOut();authScreen()}
async function boot(){
 if(!window.supabase){$('#nav').style.display='none';$('#main').innerHTML='<div class="card pos">No se pudo cargar el servicio de login. Revisá tu conexión y recargá la página.</div>';return}
 sb=window.supabase.createClient(SB_URL,SB_KEY);
 if(/type=recovery/.test(location.hash)){await sb.auth.getSession();return recoverScreen()}
 enter()}
boot();
</script></body></html>
